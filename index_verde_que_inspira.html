<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Verde que Inspira</title>
<style>
body{font-family:Arial,sans-serif;background:#eef8ee;margin:0}
header{background:#2e7d32;color:#fff;padding:20px;text-align:center}
main{max-width:800px;margin:auto;background:#fff;padding:25px}
h2{color:#2e7d32}
label{display:block;margin-top:10px}
input,select{width:100%;padding:8px}
button{margin-top:15px;background:#2e7d32;color:#fff;border:0;padding:10px 18px}
</style></head>
<body>
<header><h1>🌿 Verde que Inspira</h1><p>Únete a nuestras jornadas ambientales</p></header>
<main>
<h2>¿Cómo participar?</h2>
<ol>
<li>Completa el formulario.</li>
<li>Elige una actividad.</li>
<li>Recibirás la fecha de la jornada.</li>
<li>Participa y ayuda a cuidar el ambiente.</li>
</ol>
<h2>Formulario</h2>
<label>Nombre</label><input>
<label>Correo</label><input>
<label>Teléfono</label><input>
<label>Actividad</label>
<select><option>Reforestación</option><option>Reciclaje</option><option>Limpieza de áreas verdes</option></select>
<button>Quiero participar</button>
</main></body></html>
